<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Joe Trimmeliti</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121117; color: #f1ece2; font: 17px/1.6 "Hanken Grotesk", system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font: 400 clamp(56px, 12vw, 140px)/.9 "Instrument Serif", Georgia, serif; margin: 0 0 18px; }
  p { color: #a59fa8; margin: 0 0 30px; }
  a { display: inline-block; background: #f1ece2; color: #17151c; padding: 14px 26px; border-radius: 999px; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>Blank <em>canvas</em></h1>
  <p>This page doesn’t exist — but the paintings do.</p>
  <a href="./" id="home">Back to the gallery</a>
</main>
<script>
  // works on both a custom domain and a github.io project path
  var seg = location.pathname.split('/')[1];
  if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  else document.getElementById('home').href = '/';
</script>
</body>
</html>
